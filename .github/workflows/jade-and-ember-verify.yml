# Jade & Ember engineering verification (v0.9). Read-only: it checks out the repository, installs the pinned development tools, runs
# `npm run verify` and reports. It deploys nothing, merges nothing, publishes nothing, uses no secrets and calls no paid or AI service.
# Runner requirements and what each step needs are in jade-and-ember/engineering/CI.md. Approved for the v0.9 development branch (decision D-4).
name: Jade & Ember verify

on:
  push:
    branches: [feature/jade-and-ember-v0.9]
  pull_request:
  workflow_dispatch:

# The only permission the workflow has: read the repository contents.
permissions:
  contents: read

concurrency:
  group: jade-and-ember-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Ubuntu 24.04, Node 22, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: jade-and-ember
    env:
      STS_REQUIRE_AUDIT: '1'
    steps:
      - name: Check out the repository (all branches, because the frozen v0.8 baseline branch is needed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: jade-and-ember/package-lock.json

      - name: Install the pinned development tools (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright, and ffmpeg for the flash check
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify (all checks, regression against the frozen v0.8 baseline, self-tests)
        run: npm run verify

  # Informational: the fast checks (no browser) on macOS, to show portability problems of the tooling. Never blocks.
  # Windows is not in the matrix: the repository name ends with a dot ("STS-Cinematic-Showcase."), which Windows cannot use as a folder name,
  # so the checkout fails there before any of our code runs (seen in the first run).
  portability-smoke:
    name: fast checks on ${{ matrix.os }} (informational)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: jade-and-ember
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: jade-and-ember/package-lock.json
      - name: Install the pinned development tools
        run: npm ci --ignore-scripts
      - name: Fast verification (no browser)
        run: npm run verify:fast

  # Informational while compatibility is established (Gate 5, Phase 1, owner decision): the browser-driven checks of `npm run verify`, with the same
  # assertions, in Firefox. A failure here is evidence about Firefox, recorded as a finding by a person; it does not fail the run. Nothing is skipped
  # silently: the runner prints a matrix of every check (run, or not applicable with its reason). Baseline comparisons are made inside the engine.
  cross-browser-firefox:
    name: 'cross-browser: Firefox (informational)'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
        working-directory: jade-and-ember
    steps:
      - name: Check out the repository (all branches, because the frozen v0.8 baseline branch is needed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: jade-and-ember/package-lock.json
      - name: Install the pinned development tools (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Install Firefox for Playwright, and ffmpeg for the flash check
        run: |
          npx playwright install --with-deps firefox
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cross-browser verification in Firefox
        run: node engineering/cross-browser.mjs --engine firefox

  # Informational while compatibility is established (Gate 5, Phase 1, owner decision): the browser-driven checks of `npm run verify`, with the same
  # assertions, in WebKit. A failure here is evidence about WebKit, recorded as a finding by a person; it does not fail the run. Nothing is skipped
  # silently: the runner prints a matrix of every check (run, or not applicable with its reason). Baseline comparisons are made inside the engine.
  cross-browser-webkit:
    name: 'cross-browser: WebKit (informational)'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
        working-directory: jade-and-ember
    steps:
      - name: Check out the repository (all branches, because the frozen v0.8 baseline branch is needed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: jade-and-ember/package-lock.json
      - name: Install the pinned development tools (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Install WebKit for Playwright, and ffmpeg for the flash check
        run: |
          npx playwright install --with-deps webkit
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cross-browser verification in WebKit
        run: node engineering/cross-browser.mjs --engine webkit
