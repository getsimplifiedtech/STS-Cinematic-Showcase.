# STS SNAPSHOT caller TEMPLATE (G6-8). For the one public consumer repository, which cannot download the framework's private action. Not a workflow: it is stored under
# engineering/ci/templates and rendered with `node engineering/tools/ci/render.mjs snapshot-caller`. What it does when rendered: it checks out the repository and runs one mode of the
# STS engineering per job, using the VERIFIED COPY of the framework's composite action that sits in the same repository (.github/actions/engineering) beside the verified copy of the
# engineering (engineering/); both are listed, file by file, in sts-framework-snapshot.json and checked on every run. Same seven jobs, same rules as the client caller: no `run` step,
# no environment, no condition, no input that could skip or soften a check; contents: read, no secret. check:ci refuses it in any repository that is not on the snapshot list.
name: STS verify

on:
  push:
    branches: ['feature/jade-and-ember-v0.9']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sts-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Ubuntu 24.04, Node 24, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify (all checks, self-tests)
        uses: ./.github/actions/engineering
        with:
          mode: verify
          project-dir: 'jade-and-ember'

  portability-smoke:
    name: fast checks on macos-latest (informational)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fast verification (no browser)
        uses: ./.github/actions/engineering
        with:
          mode: fast
          project-dir: 'jade-and-ember'

  cross-browser-firefox:
    name: 'cross-browser: Firefox (informational)'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 55
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cross-browser verification in Firefox
        uses: ./.github/actions/engineering
        with:
          mode: firefox
          project-dir: 'jade-and-ember'

  cross-browser-webkit:
    name: 'cross-browser: WebKit (informational)'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 55
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cross-browser verification in WebKit
        uses: ./.github/actions/engineering
        with:
          mode: webkit
          project-dir: 'jade-and-ember'

  external-links:
    name: external links (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the external destinations (record printed in the log)
        uses: ./.github/actions/engineering
        with:
          mode: external-links
          project-dir: 'jade-and-ember'

  lighthouse:
    name: lighthouse (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lighthouse (every page, three runs each; the table is printed in the log)
        uses: ./.github/actions/engineering
        with:
          mode: lighthouse
          project-dir: 'jade-and-ember'

  supply-chain-report:
    name: supply chain report (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report (signatures, advisories, SBOM, outdated)
        uses: ./.github/actions/engineering
        with:
          mode: supply-chain-report
          project-dir: 'jade-and-ember'
