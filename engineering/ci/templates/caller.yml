# STS client verification caller TEMPLATE (G6-7). Not a workflow: it is stored under engineering/ci/templates and rendered into a client repository's
# .github/workflows with `node engineering/tools/ci/render.mjs caller` (placeholders in double braces are filled and checked). What it does when rendered: it checks
# out the client repository and runs one mode of the STS engineering per job, using the framework's composite action by the framework's FULL COMMIT SHA, nothing else.
# It carries no `run` step, no environment, no condition and no input that could skip or soften a check; check:ci refuses a caller that does. Read-only
# (contents: read), no secret, no deployment, no merge. The seven jobs are those of engineering/ci/jobs.json. The repository must be private and in the
# organisation that owns the framework, and the framework repository's Actions access setting must allow it (specification 16, section 10.8); nothing here sets that.
name: STS verify

on:
  push:
    branches: ['{{DEVELOPMENT_BRANCH}}']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sts-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Ubuntu 24.04, Node 24, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify (all checks, self-tests)
        uses: getsimplifiedtech/sts-web-design-framework/.github/actions/engineering@{{FRAMEWORK_SHA}}
        with:
          mode: verify
          project-dir: '{{PROJECT_DIR}}'

  portability-smoke:
    name: fast checks on macos-latest (informational)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fast verification (no browser)
        uses: getsimplifiedtech/sts-web-design-framework/.github/actions/engineering@{{FRAMEWORK_SHA}}
        with:
          mode: fast
          project-dir: '{{PROJECT_DIR}}'

  cross-browser-firefox:
    name: 'cross-browser: Firefox (informational)'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 55
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cross-browser verification in Firefox
        uses: getsimplifiedtech/sts-web-design-framework/.github/actions/engineering@{{FRAMEWORK_SHA}}
        with:
          mode: firefox
          project-dir: '{{PROJECT_DIR}}'

  cross-browser-webkit:
    name: 'cross-browser: WebKit (informational)'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 55
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cross-browser verification in WebKit
        uses: getsimplifiedtech/sts-web-design-framework/.github/actions/engineering@{{FRAMEWORK_SHA}}
        with:
          mode: webkit
          project-dir: '{{PROJECT_DIR}}'

  external-links:
    name: external links (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the external destinations (record printed in the log)
        uses: getsimplifiedtech/sts-web-design-framework/.github/actions/engineering@{{FRAMEWORK_SHA}}
        with:
          mode: external-links
          project-dir: '{{PROJECT_DIR}}'

  lighthouse:
    name: lighthouse (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lighthouse (every page, three runs each; the table is printed in the log)
        uses: getsimplifiedtech/sts-web-design-framework/.github/actions/engineering@{{FRAMEWORK_SHA}}
        with:
          mode: lighthouse
          project-dir: '{{PROJECT_DIR}}'

  supply-chain-report:
    name: supply chain report (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out the repository (full history, because the credential scan and the baseline read it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report (signatures, advisories, SBOM, outdated)
        uses: getsimplifiedtech/sts-web-design-framework/.github/actions/engineering@{{FRAMEWORK_SHA}}
        with:
          mode: supply-chain-report
          project-dir: '{{PROJECT_DIR}}'
